<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../CSS/FAQ.css">
    <title>OMS - Contact</title>
</head>
<body>
    <!-- HEADER -->
    <header class="oms-header">
        <div class="container-fluid">
            <div class="row align-items-center py-2">
                <div class="col-auto logo">
                    <a href="index.html" aria-label="Retour à l'accueil">
                        <img src="../Annexes/Images/logo_OMS.svg" alt="Logo OMS - Office Municipal du Sport">
                    </a>
                </div>
                <div class="col d-flex justify-content-center justify-content-lg-start ps-lg-5">
                    <nav class="oms-nav" aria-label="Navigation principale">
                        <a href="stage.html">STAGE</a>
                        <a href="galerie.html">GALERIE</a>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <!-- FORMULAIRE DE CONTACT -->
    <main class="container py-5">
        <section class="contact-box mx-auto" aria-labelledby="titre-contact">
            <h1 id="titre-contact" class="mb-2">Nous contacter</h1>
            <p class="contact-intro mb-4">Remplissez le formulaire pour nous envoyer un message.</p>

            <form action="#" method="post">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="nom" class="form-label">Nom</label>
                        <input type="text" class="form-control" id="nom" name="nom" placeholder="Votre nom" autocomplete="family-name" required>
                    </div>

                    <div class="col-md-6">
                        <label for="prenom" class="form-label">Prénom</label>
                        <input type="text" class="form-control" id="prenom" name="prenom" placeholder="Votre prénom" autocomplete="given-name" required>
                    </div>

                    <div class="col-12">
                        <label for="email" class="form-label">Adresse mail</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="exemple@domaine.fr" autocomplete="email" required>
                    </div>

                    <div class="col-12">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" name="message" rows="6" placeholder="Écrivez votre message ici..." required></textarea>
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-success">Envoyer le message</button>
                    </div>
                </div>
            </form>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="oms-footer py-3">
        <div class="container-fluid d-flex flex-wrap justify-content-between align-items-center gap-2">
            <p>Dernière mise à jour 15/09/2026&nbsp;&nbsp;-&nbsp;&nbsp;Adresse&nbsp;: 25 Rue de Strasbourg 44000 NANTES - <a href="FAQ.html">FAQ</a></p>
            <img src="../Annexes/Images/logo_ball_oms.svg" alt="" class="ball-icon">
        </div>
    </footer>
</body>
</html>
